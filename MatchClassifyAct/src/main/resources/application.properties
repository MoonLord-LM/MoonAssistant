spring.application.name=MatchClassifyAct

logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
logging.level.root=info

# ========== 启动行为 ==========
# 启动就绪后自动打开控制台网页（以 Edge/Chrome 应用窗口方式打开，退出时页面可自关）
ui.auto-open=true
# 自动打开的网页路径
ui.path=/annotate
# 控制台应用窗口尺寸（宽x高）；0x0 = 不指定，交给系统
ui.window-size=1600x900
# 控制台应用窗口是否在屏幕可用区域内居中展示
ui.center=true

# 请求 URI / 查询串统一按 UTF-8 解码（产物目录名为中文分类标注）
server.tomcat.uri-encoding=UTF-8

# ========== 截图设置（Windows Graphics Capture 后台采集） ==========
# 目标图形程序窗口标题关键字（改成你想自动化的任意 GUI 程序即可），命中任一即视为候选；
# 多个窗口命中时取面积最大的那个；默认值 = 演示用的 MuMu 模拟器
capture.window-keywords=MuMu模拟器,MuMu安卓设备,MuMu
# 每隔多少毫秒截图一次
capture.interval-ms=3000
# ---- 图片 / 数据保存目录（均相对程序运行目录）----
# 捕获的原始截图（未标注）保存目录
capture.capture-dir=capture
# 标注后的截图 + 标注数据 .json 保存目录
capture.classify-dir=classify
# 分析后产生的对照图 + 分析数据保存目录
capture.summary-dir=summary
# 旧版单目录（截图/标注/汇总同根 captures/）：仅在启动时自动迁移到上述新布局，之后不再使用
capture.output-dir=captures
# WindowsCapture 采集器内部抓帧超时（毫秒）
capture.capture-timeout-ms=5000
# 强制截图目标尺寸（物理像素）：宽高都 >0 时，只有截出来恰好等于该尺寸的 PNG 才会保存；
# 截图尺寸不符会丢弃该帧，并自动用 SetWindowPos 把窗口强制缩放后重截，直到截图达标为止（最大化窗口会自动先还原）。
# 注意：为保证画面不变形/无黑边，需把目标程序的显示分辨率与方向配置成同尺寸（例如 MuMu 模拟器内设为 1280x720、16:9）。
# 任一为 0 则关闭尺寸校验，按旧行为原样保存截图。
capture.resize-width=1280
capture.resize-height=720
